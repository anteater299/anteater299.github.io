<div class="upload-section" style="margin-top: 15px;">
  <label style="color: #d35400; font-weight: bold;">*附件照片 (預覽)</label>
  <div id="preview-container" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;">
    <div id="upload-trigger" style="width: 80px; height: 80px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px;">
      <span style="font-size: 24px; color: #ccc;">+</span>
    </div>
  </div>
  <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
</div>

<script>
  const trigger = document.getElementById('upload-trigger');
  const input = document.getElementById('file-input');
  const container = document.getElementById('preview-container');

  trigger.onclick = () => input.click();

  input.onchange = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const div = document.createElement('div');
      div.style.position = 'relative';
      div.innerHTML = `
        <img src="${url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
        <button onclick="this.parentElement.remove()" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">×</button>
      `;
      container.insertBefore(div, trigger);
    });
  };
</script>
<head>
    <title>上下排序清單</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        #sortable-list {
            width: 300px;
            padding: 0;
            list-style: none;
        }
        .list-item {
            padding: 15px;
            margin: 5px 0;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            cursor: grab; /* 讓滑鼠顯示「抓取」圖示 */
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        /* 被拖動時的樣式 */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e2e2e2;
        }
    </style>
</head>
<body>

    <h2>我的任務清單</h2>
    <ul id="sortable-list">
        <li class="list-item">項目 1：買牛奶</li>
        <li class="list-item">項目 2：洗衣服</li>
        <li class="list-item">項目 3：寫程式</li>
        <li class="list-item">項目 4：運動 30 分鐘</li>
    </ul>

    <script>
        const el = document.getElementById('sortable-list');
        // 初始化排序功能
        new Sortable(el, {
            animation: 150,       // 排序時的動畫速度 (ms)
            ghostClass: 'sortable-ghost', // 拖動時預覽位置的樣式
            onEnd: function (evt) {
                console.log('舊索引:', evt.oldIndex);
                console.log('新索引:', evt.newIndex);
                // 這裡可以加入 API 呼叫，將新順序存入資料庫
            }
        });
    </script>
</body>
